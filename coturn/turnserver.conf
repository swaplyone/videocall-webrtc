# ==========================================
# Swaply Production coturn Configuration
# ==========================================

# Listening port for STUN and TURN (UDP & TCP)
listening-port=3478

# Listening port for TURN over TLS (TCP & UDP)
tls-listening-port=5349

# Listening IP addresses (leave blank to listen on all interfaces)
# listening-ip=0.0.0.0

# External/Public IP address of the TURN server (must resolve to this host)
# external-ip=1.2.3.4

# Enable secure TURN REST API for time-limited credentials
use-auth-secret
static-auth-secret=swaply_turn_secret_key_98765

# Expiry threshold for REST API tokens (in seconds)
# Default is 1 day (86400).
user-db-delay=3600

# Realm name (domain of the TURN server)
realm=turn.swaply.org

# Enable UDP and TCP transport layers
# (Enabled by default, can restrict if needed)

# TLS Certificate configurations (for turns:// support)
cert=/etc/letsencrypt/live/turn.swaply.org/fullchain.pem
pkey=/etc/letsencrypt/live/turn.swaply.org/privkey.pem

# Secure cipher suites for TLS
cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"

# Disable insecure protocols
no-sslv3
no-tlsv1
no-tlsv1.1

# Enable detailed logging
verbose
syslog

# Limit ports allocated for relay connections
min-port=49152
max-port=65535
